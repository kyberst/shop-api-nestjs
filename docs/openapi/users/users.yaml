paths:
  /api/users:
    get:
      operationId: UsersController_findAll
      summary: List all users
      parameters: []
      responses:
        "200":
          description: Return all users
      tags:
        - Users
      security:
        - bearer: []
  /api/users/{id}/role:
    patch:
      operationId: UsersController_updateRole
      summary: Update user role
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequestDto"
      responses:
        "200":
          description: Role updated successfully
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      tags:
        - Users
      security:
        - bearer: []
