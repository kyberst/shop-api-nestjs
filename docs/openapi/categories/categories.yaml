paths:
  /api/categories:
    get:
      operationId: FindAllCategoriesController_findAll
      summary: Get all categories
      parameters: []
      responses:
        "200":
          description: Return all categories
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: number
                  resultType:
                    type: string
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
      tags:
        - Categories
    post:
      operationId: CreateCategoryController_create
      summary: Create a new category
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequestDto"
      responses:
        "201":
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponseDto"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      tags:
        - Categories
      security:
        - bearer: []
  /api/categories/{id}:
    patch:
      operationId: UpdateCategoryController_update
      summary: Update a category
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequestDto"
      responses:
        "200":
          description: Category updated successfully
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: number
                    example: 200
                  resultType:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
                    example: Category updated successfully
                  data:
                    $ref: "#/components/schemas/CategoryResponseDto"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      tags:
        - Categories
      security:
        - bearer: []
    delete:
      operationId: RemoveCategoryController_remove
      summary: Remove a category
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Category removed successfully
      tags:
        - Categories
      security:
        - bearer: []
